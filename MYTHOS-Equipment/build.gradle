plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.ksp.mythosequipment'
version = '0.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft { mappings channel: 'official', version: '1.21.1' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.21.1-52.1.5' }
sourceSets {
    classesApi {
        java.srcDir '../MYTHOS-Classes/src/main/java'
        java.include 'com/ksp/mythosclasses/ClassApi.java', 'com/ksp/mythosclasses/ClassStore.java', 'com/ksp/mythosclasses/ClassRules.java'
        compileClasspath += sourceSets.main.compileClasspath
    }
    main { compileClasspath += sourceSets.classesApi.output }
}
tasks.named('compileJava') { dependsOn tasks.named('compileClassesApiJava') }
def generated = layout.buildDirectory.dir('generated/equipmentAssets')
tasks.register('generateEquipmentAssets') {
    inputs.file('tools/EquipmentAssets.java')
    inputs.file('src/main/java/com/ksp/mythosequipment/EquipmentRules.java')
    outputs.dir(generated)
    doLast {
        delete generated.get().asFile
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get()
        def output = layout.buildDirectory.dir('assetGenerator').get().asFile
        output.mkdirs()
        exec { commandLine new File(launcher.metadata.installationPath.asFile,'bin/javac'), '-d', output, file('src/main/java/com/ksp/mythosequipment/EquipmentRules.java'), file('tools/EquipmentAssets.java') }
        exec { commandLine launcher.executablePath.asFile, '-cp', output, 'com.ksp.mythosequipment.EquipmentAssets', generated.get().asFile }
    }
}
tasks.named('processResources') { dependsOn tasks.named('generateEquipmentAssets'); from(generated) }
