name: MYTHOS-Classes build
on:
  pull_request:
    paths: ['MYTHOS-Classes/**', '.github/workflows/mythos-classes.yml']
  push:
    branches: [main]
    paths: ['MYTHOS-Classes/**', '.github/workflows/mythos-classes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MYTHOS-Classes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test class identity, base stats and progression
        run: |
          mkdir -p build/rules-check
          javac -d build/rules-check src/main/java/com/ksp/mythosclasses/ClassRules.java tools/ClassRulesCheck.java
          java -cp build/rules-check com.ksp.mythosclasses.ClassRulesCheck
      - name: Forge wrapper
        run: |
          curl --fail --show-error --silent --location --retry 3 https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-52.1.5/forge-1.21.1-52.1.5-mdk.zip -o "${RUNNER_TEMP}/forge-mdk.zip"
          unzip -o "${RUNNER_TEMP}/forge-mdk.zip" gradlew 'gradle/wrapper/*'
          chmod +x gradlew
      - name: Compile mod
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: mythos-classes-0.1.2
          path: |
            MYTHOS-Classes/build/libs/*.jar
            MYTHOS-Classes/README.md
          if-no-files-found: error
