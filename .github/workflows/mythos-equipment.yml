name: MYTHOS-Equipment build
on:
  pull_request:
    paths: ['MYTHOS-Equipment/**', 'MYTHOS-Classes/**', '.github/workflows/mythos-equipment.yml']
  push:
    branches: [main]
    paths: ['MYTHOS-Equipment/**', 'MYTHOS-Classes/**', '.github/workflows/mythos-equipment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MYTHOS-Equipment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check catalog and rarity rolls
        run: |
          mkdir -p build/rules-check
          javac -d build/rules-check src/main/java/com/ksp/mythosequipment/EquipmentRules.java tools/EquipmentRulesCheck.java
          java -cp build/rules-check com.ksp.mythosequipment.EquipmentRulesCheck
      - name: Forge wrapper
        run: |
          curl --fail --show-error --silent --location --retry 3 https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-52.1.5/forge-1.21.1-52.1.5-mdk.zip -o "${RUNNER_TEMP}/forge-mdk.zip"
          unzip -o "${RUNNER_TEMP}/forge-mdk.zip" gradlew 'gradle/wrapper/*'
          chmod +x gradlew
      - name: Compile mod
        run: ./gradlew --no-daemon build
      - name: Verify packaged assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, json, struct
          jar=next(Path("build/libs").glob("mythos-equipment-0.1.2.jar"))
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              assert len([n for n in names if n.startswith("assets/mythosequipment/textures/item/") and n.endswith(".png")])==240
              assert len([n for n in names if n.startswith("assets/mythosequipment/textures/models/armor/") and n.endswith(".png")])==48
              assert not any(n.startswith("com/ksp/mythosclasses/") for n in names)
              models=[n for n in names if n.startswith("assets/mythosequipment/models/item/") and n.endswith(".json")]
              meshes=[json.loads(z.read(n)) for n in models]
              assert sum(bool(m.get("elements")) for m in meshes)>=144
              for m in meshes:
                  for e in m.get("elements",[]):
                      assert all(-16<=a<=b<=32 for a,b in zip(e["from"],e["to"]))
                  for o in m.get("overrides",[]):
                      assert "assets/"+o["model"].replace(":","/models/")+".json" in names
              for n in names:
                  if n.startswith("assets/mythosequipment/textures/models/armor/") and n.endswith(".png"):
                      assert struct.unpack(">II",z.read(n)[16:24])==(512,256)
              assert z.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mythos-equipment-0.1.2
          path: |
            MYTHOS-Equipment/build/libs/*.jar
            MYTHOS-Equipment/README.md
          if-no-files-found: error
