name: MYTHOS Model Engine
on:
  pull_request:
    paths: ['MYTHOS-ModelEngine/**', '.github/workflows/mythos-model-engine.yml']
  push:
    branches: [main]
    paths: ['MYTHOS-ModelEngine/**', '.github/workflows/mythos-model-engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test core
        working-directory: MYTHOS-ModelEngine
        run: |
          mkdir -p build/classes
          javac --release 21 -d build/classes $(find src/main/java src/test/java -name '*.java')
          java -cp build/classes com.ksp.mythos.model.RegistryTest
          java -cp build/classes com.ksp.mythos.model.CapabilityTest
          java -cp build/classes com.ksp.mythos.model.AssetVerifierTest
