name: MYTHOS-Pets build
on:
  pull_request:
    paths: ['MYTHOS-Pets/**', 'MYTHOS-Economy/**', '.github/workflows/mythos-pets.yml']
  push:
    branches: [main]
    paths: ['MYTHOS-Pets/**', 'MYTHOS-Economy/**', '.github/workflows/mythos-pets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MYTHOS-Pets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Forge wrapper
        run: |
          curl --fail --show-error --silent --location --retry 3 https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-52.1.5/forge-1.21.1-52.1.5-mdk.zip -o "${RUNNER_TEMP}/forge-mdk.zip"
          unzip -o "${RUNNER_TEMP}/forge-mdk.zip" gradlew 'gradle/wrapper/*'
          chmod +x gradlew
      - name: Check cinematic geometry budget
        run: python3 tools/check_dragon_geometry.py
      - name: Compile mod
        run: ./gradlew --no-daemon build
      - name: Verify embedded pet resources
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import struct
          import zipfile

          jars = list(pathlib.Path('build/libs').glob('mythos-pets-*.jar'))
          jars = [p for p in jars if not p.name.endswith(('-sources.jar', '-javadoc.jar'))]
          assert len(jars) == 1, f'Expected one distributable JAR, found {jars}'
          with zipfile.ZipFile(jars[0]) as jar:
              required = {
                  'META-INF/mods.toml',
                  'pack.mcmeta',
                  'assets/mythospets/textures/entity/mooncat.png',
                  'com/ksp/mythospets/PetClient.class',
                  'com/ksp/mythospets/MooncatMeshModel.class',
                  'com/ksp/mythospets/DragonMeshModel.class',
                  'com/ksp/mythospets/DragonEntity.class',
                  'assets/mythospets/textures/entity/ember_dragon.png',
                  'assets/mythospets/meshes/ember_dragon.anatomy',
                  'com/ksp/mythospets/PetEntities.class',
                  'com/ksp/mythospets/PetServer.class',
              }
              missing = required - set(jar.namelist())
              assert not missing, f'Missing embedded resources: {missing}'
              assert jar.testzip() is None, 'Corrupt JAR entry'
              meta = json.loads(jar.read('pack.mcmeta'))
              assert meta['pack']['pack_format'] == 34
              assert meta['pack']['description']
              for name in ('mooncat', 'ember_dragon'):
                  png = jar.read(f'assets/mythospets/textures/entity/{name}.png')
                  assert png[:8] == b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II', png[16:24]) == ((4096, 4096) if name == 'ember_dragon' else (64, 64))
              print(f'Validated self-contained pet assets in {jars[0]}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mythos-pets-0.4.6
          path: |
            MYTHOS-Pets/build/libs/*.jar
            MYTHOS-Pets/README.md
          if-no-files-found: error
