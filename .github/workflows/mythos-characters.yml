name: MYTHOS-Characters build
on:
  pull_request:
    paths: ['MYTHOS-Characters/**', '.github/workflows/mythos-characters.yml']
  push:
    branches: [main]
    paths: ['MYTHOS-Characters/**', '.github/workflows/mythos-characters.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MYTHOS-Characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate player mesh and LODs
        run: |
          mkdir -p build/mesh-check
          javac -d build/mesh-check src/main/java/com/ksp/mythoscharacters/CharacterMesh.java tools/CharacterMeshCheck.java
          java -cp build/mesh-check com.ksp.mythoscharacters.CharacterMeshCheck
      - name: Forge wrapper
        run: |
          curl --fail --show-error --silent --location --retry 3 https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-52.1.5/forge-1.21.1-52.1.5-mdk.zip -o "${RUNNER_TEMP}/forge-mdk.zip"
          unzip -o "${RUNNER_TEMP}/forge-mdk.zip" gradlew 'gradle/wrapper/*'
          chmod +x gradlew
      - name: Compile mod
        run: ./gradlew --no-daemon build
      - name: Validate packaged mod metadata
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          jar = Path("build/libs/mythos-characters-0.1.1.jar")
          with zipfile.ZipFile(jar) as z:
              pack = json.loads(z.read("pack.mcmeta"))["pack"]
              assert pack["pack_format"] == 34
              assert pack["description"]
              assert b'version="0.1.1"' in z.read("META-INF/mods.toml")
              assert z.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mythos-characters-0.1.1
          path: |
            MYTHOS-Characters/build/libs/*.jar
            MYTHOS-Characters/README.md
          if-no-files-found: error
