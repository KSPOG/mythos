import java.util.Base64

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.ksp.mythospets'
version = '0.3.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft {
    mappings channel: 'official', version: '1.21.1'
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.21.1-52.1.5' }

sourceSets {
    economyApi {
        java.srcDir '../MYTHOS-Economy/src/main/java'
        java.include 'com/ksp/mythoseconomy/EconomyApi.java', 'com/ksp/mythoseconomy/Ledger.java'
        compileClasspath += sourceSets.main.compileClasspath
    }
    main { compileClasspath += sourceSets.economyApi.output }
}
tasks.named('compileJava') { dependsOn tasks.named('compileEconomyApiJava') }

def mooncatTexture = layout.projectDirectory.file('src/main/texture-source/mooncat.png.b64')
def generatedTextures = layout.buildDirectory.dir('generated/petTextures')
tasks.register('generatePetTextures') {
    inputs.file(mooncatTexture)
    outputs.dir(generatedTextures)
    doLast {
        def output = generatedTextures.get().file('assets/mythospets/textures/entity/mooncat.png').asFile
        output.parentFile.mkdirs()
        output.bytes = Base64.getDecoder().decode(mooncatTexture.asFile.text.trim())
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generatePetTextures')
    from(generatedTextures)
}
