plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.npcarchitects'
version = '0.1.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft {
    mappings channel: 'official', version: '1.21.1'
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { npcarchitects { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.21.1-52.1.5' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
