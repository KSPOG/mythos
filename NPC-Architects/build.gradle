plugins {
 id 'java'
 id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}
group = 'com.npcarchitects'
version = '0.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft {
 mappings channel: 'official', version: '1.21.10'
 runs { register('server') { args '--nogui'; workingDir = layout.projectDirectory.dir('run') } }
}
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies { implementation minecraft.dependency('net.minecraftforge:forge:1.21.10-60.0.1') }
