plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false }
subprojects {
    apply plugin: 'java'
    apply plugin: 'net.minecraftforge.gradle'
    group = 'com.ksp.mythos'
    version = '0.1.0'
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    minecraft { mappings channel: 'official', version: '1.21.1' }
    repositories { mavenCentral() }
    dependencies { minecraft 'net.minecraftforge:forge:1.21.1-52.1.5' }
    if (project.name != 'core') {
        dependencies { implementation project(':core') }
    }
    base { archivesName = "mythos-${project.name}" }
}
